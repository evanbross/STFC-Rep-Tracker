<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factions - STFC Rep Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <a href="/">Tracker</a>
        <a href="/factions.html" class="active">Factions</a>
        <a href="/faction-types.html">Faction Types</a>
        <a href="/reputations.html">Reputations</a>
    </nav>

    <h1>Factions Management</h1>

    <div class="container">
        <h2>Factions</h2>
        <button onclick="showAddForm()">Add New Faction</button>

        <div id="addForm">
            <h3 id="formTitle">Add New Faction</h3>
            <form id="factionForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label for="name">Faction Name:</label>
                    <input type="text" id="name" required placeholder="e.g., Federation, Klingon, Romulan">
                </div>
                <div class="form-group">
                    <label for="faction_type">Faction Type:</label>
                    <select id="faction_type" required>
                        <option value="">Select Type...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="on_chart">On Chart:</label>
                    <input type="number" id="on_chart" required min="0" step="1" value="0" placeholder="e.g., 0">
                </div>
                <button type="submit">Save</button>
                <button type="button" class="cancel" onclick="cancelForm()">Cancel</button>
            </form>
        </div>

        <table id="factionsTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>On Chart</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="factionsBody">
                <tr>
                    <td colspan="3">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // API base URL
        const API_URL = '/api';

        let factionTypes = [];

        // Load faction types
        async function loadFactionTypes() {
            try {
                const response = await fetch(`${API_URL}/faction-types`);
                if (!response.ok) throw new Error('Failed to load faction types');
                factionTypes = await response.json();
                
                const typeSelect = document.getElementById('faction_type');
                typeSelect.innerHTML = '<option value="">Select Type...</option>' + 
                    factionTypes.map(ft => 
                        `<option value="${ft.id}">${ft.name} (${ft.code})</option>`
                    ).join('');
            } catch (error) {
                console.error('Error loading faction types:', error);
            }
        }

        // Load factions
        async function loadFactions() {
            try {
                const response = await fetch(`${API_URL}/factions`);
                if (!response.ok) {
                    throw new Error('Failed to load factions');
                }
                const factions = await response.json();
                displayFactions(factions);
            } catch (error) {
                console.error('Error loading factions:', error);
                document.getElementById('factionsBody').innerHTML =
                    '<tr><td colspan="3">Failed to load factions.</td></tr>';
            }
        }

        // Display factions in table
        function displayFactions(factions) {
            const tbody = document.getElementById('factionsBody');

            if (factions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">No factions found.</td></tr>';
                return;
            }

            tbody.innerHTML = factions.map(f => `
                <tr>
                    <td>${f.name}</td>
                    <td><span class="code-badge" style="background-color: ${f.color || '#e0e0e0'}; color: ${['black', 'royalblue', 'red', 'green'].includes(f.color) ? 'white' : '#555'}">${f.faction_type}</span></td>
                    <td>${f.on_chart ?? 0}</td>
                    <td>
                        <button class="action-btn edit-btn" onclick="editFaction(${f.id}, '${f.name}', ${f.faction_type_id}, ${f.on_chart ?? 0})">Edit</button>
                    </td>
                </tr>
            `).join('');
        }

        // Show add form
        function showAddForm() {
            document.getElementById('addForm').classList.add('active');
            document.getElementById('formTitle').textContent = 'Add New Faction';
            document.getElementById('factionForm').reset();
            document.getElementById('editId').value = '';
        }

        // Edit faction
        function editFaction(id, name, faction_type_id, on_chart = 0) {
            document.getElementById('addForm').classList.add('active');
            document.getElementById('formTitle').textContent = 'Edit Faction';
            document.getElementById('editId').value = id;
            document.getElementById('name').value = name;
            document.getElementById('faction_type').value = faction_type_id;
            document.getElementById('on_chart').value = on_chart ?? 0;

            // Scroll to form
            document.getElementById('addForm').scrollIntoView({ behavior: 'smooth' });
        }

        // Cancel form
        function cancelForm() {
            document.getElementById('addForm').classList.remove('active');
            document.getElementById('factionForm').reset();
        }

        // Handle form submission
        document.getElementById('factionForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const id = document.getElementById('editId').value;
            const name = document.getElementById('name').value.trim();
            const faction_type_id = document.getElementById('faction_type').value;
            const on_chart = parseInt(document.getElementById('on_chart').value || '0', 10);

            if (!name || !faction_type_id) {
                alert('Please fill in all fields');
                return;
            }

            try {
                let response;
                if (id) {
                    // Update existing
                    response = await fetch(`${API_URL}/factions/${id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ name, faction_type_id, on_chart })
                    });
                } else {
                    // Create new
                    response = await fetch(`${API_URL}/factions`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ name, faction_type_id, on_chart })
                    });
                }

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to save faction');
                }

                // Reload the list
                await loadFactions();

                // Hide and reset form
                cancelForm();
            } catch (error) {
                console.error('Error saving faction:', error);
                alert('Failed to save faction: ' + error.message);
            }
        });

        // Initialize
        loadFactionTypes();
        loadFactions();
    </script>
</body>
</html>
