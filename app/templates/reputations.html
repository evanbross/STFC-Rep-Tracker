<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reputations - STFC Rep Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <a href="/">Tracker</a>
        <a href="/factions.html">Factions</a>
        <a href="/faction-types.html">Faction Types</a>
        <a href="/reputations.html" class="active">Reputations</a>
    </nav>

    <h1>Reputations</h1>

    <div class="container">
        <h2>Standard Reputation Tiers</h2>
        <table id="reputationsTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Low Limit</th>
                    <th>High Limit</th>
                </tr>
            </thead>
            <tbody id="reputationsBody">
                <tr>
                    <td colspan="3">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="container">
        <h2>Augment Reputation Tiers</h2>
        <table id="augmentReputationsTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Low Limit</th>
                    <th>High Limit</th>
                </tr>
            </thead>
            <tbody id="augmentReputationsBody">
                <tr>
                    <td colspan="3">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="container">
        <h2>Rogue Reputation Tiers</h2>
        <table id="rogueReputationsTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Low Limit</th>
                    <th>High Limit</th>
                </tr>
            </thead>
            <tbody id="rogueReputationsBody">
                <tr>
                    <td colspan="3">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = '/api';

        async function loadReputations() {
            try {
                const response = await fetch(`${API_URL}/reputations`);
                if (!response.ok) {
                    throw new Error('Failed to load reputations');
                }
                const reputations = await response.json();
                displayReputations(reputations, 'reputationsBody');
            } catch (error) {
                console.error('Error loading reputations:', error);
                document.getElementById('reputationsBody').innerHTML =
                    '<tr><td colspan="3">Failed to load reputations.</td></tr>';
            }
        }

        async function loadAugmentReputations() {
            try {
                const response = await fetch(`${API_URL}/augment-reputations`);
                if (!response.ok) {
                    throw new Error('Failed to load augment reputations');
                }
                const reputations = await response.json();
                displayReputations(reputations, 'augmentReputationsBody');
            } catch (error) {
                console.error('Error loading augment reputations:', error);
                document.getElementById('augmentReputationsBody').innerHTML =
                    '<tr><td colspan="3">Failed to load augment reputations.</td></tr>';
            }
        }

        async function loadRogueReputations() {
            try {
                const response = await fetch(`${API_URL}/rogue-reputations`);
                if (!response.ok) {
                    throw new Error('Failed to load rogue reputations');
                }
                const reputations = await response.json();
                displayReputations(reputations, 'rogueReputationsBody');
            } catch (error) {
                console.error('Error loading rogue reputations:', error);
                document.getElementById('rogueReputationsBody').innerHTML =
                    '<tr><td colspan="3">Failed to load rogue reputations.</td></tr>';
            }
        }

        function displayReputations(reputations, tbodyId) {
            const tbody = document.getElementById(tbodyId);

            if (reputations.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">No reputations found.</td></tr>';
                return;
            }

            tbody.innerHTML = reputations.map(rep => `
                <tr>
                    <td>${rep.name}</td>
                    <td>${rep.low_limit.toLocaleString()}</td>
                    <td>${rep.high_limit !== null && rep.high_limit !== undefined ? rep.high_limit.toLocaleString() : '-'}</td>
                </tr>
            `).join('');
        }

        loadReputations();
        loadAugmentReputations();
        loadRogueReputations();
    </script>
</body>
</html>
