<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faction Types - STFC Rep Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <a href="/">Tracker</a>
        <a href="/factions.html">Factions</a>
        <a href="/faction-types.html" class="active">Faction Types</a>
        <a href="/reputations.html">Reputations</a>
    </nav>

    <h1>Faction Types Management</h1>

    <div class="container">
        <h2>Faction Types</h2>
        <button onclick="showAddForm()">Add New Faction Type</button>

        <div id="addForm">
            <h3 id="formTitle">Add New Faction Type</h3>
            <form id="factionTypeForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label for="code">Code:</label>
                    <input type="text" id="code" required placeholder="e.g., FED, KLI, ROM" maxlength="10">
                </div>
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" required placeholder="e.g., Federation, Klingon, Romulan">
                </div>
                <div class="form-group">
                    <label for="color">Color:</label>
                    <input type="text" id="color" placeholder="e.g., gold, #FFD700, rgb(255, 215, 0)">
                </div>
                <button type="submit">Save</button>
                <button type="button" class="cancel" onclick="cancelForm()">Cancel</button>
            </form>
        </div>

        <table id="factionTypesTable">
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Color</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="factionTypesBody">
                <tr>
                    <td colspan="3">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // API base URL
        const API_URL = '/api';

        // Load faction types
        async function loadFactionTypes() {
            try {
                const response = await fetch(`${API_URL}/faction-types`);
                if (!response.ok) {
                    throw new Error('Failed to load faction types');
                }
                const factionTypes = await response.json();
                displayFactionTypes(factionTypes);
            } catch (error) {
                console.error('Error loading faction types:', error);
                document.getElementById('factionTypesBody').innerHTML =
                    '<tr><td colspan="3">Failed to load faction types. Make sure the backend is running.</td></tr>';
            }
        }

        // Display faction types in table
        function displayFactionTypes(factionTypes) {
            const tbody = document.getElementById('factionTypesBody');

            if (factionTypes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">No faction types found.</td></tr>';
                return;
            }

            tbody.innerHTML = factionTypes.map(ft => `
                <tr>
                    <td>${ft.code}</td>
                    <td>${ft.name}</td>
                    <td>
                        ${ft.color ? `
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <div style="width: 20px; height: 20px; border-radius: 4px; background-color: ${ft.color}; border: 1px solid #ddd;"></div>
                                <span>${ft.color}</span>
                            </div>
                        ` : '<span style="color: #999;">None</span>'}
                    </td>
                    <td>
                        <button class="action-btn edit-btn" onclick="editFactionType(${ft.id}, '${ft.code}', '${ft.name}', '${ft.color || ''}')">Edit</button>
                    </td>
                </tr>
            `).join('');
        }

        // Show add form
        function showAddForm() {
            document.getElementById('addForm').classList.add('active');
            document.getElementById('formTitle').textContent = 'Add New Faction Type';
            document.getElementById('factionTypeForm').reset();
            document.getElementById('editId').value = '';
        }

        // Edit faction type
        function editFactionType(id, code, name, color) {
            document.getElementById('addForm').classList.add('active');
            document.getElementById('formTitle').textContent = 'Edit Faction Type';
            document.getElementById('editId').value = id;
            document.getElementById('code').value = code;
            document.getElementById('name').value = name;
            document.getElementById('color').value = color || '';

            // Scroll to form
            document.getElementById('addForm').scrollIntoView({ behavior: 'smooth' });
        }

        // Cancel form
        function cancelForm() {
            document.getElementById('addForm').classList.remove('active');
            document.getElementById('factionTypeForm').reset();
        }

        // Handle form submission
        document.getElementById('factionTypeForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const id = document.getElementById('editId').value;
            const code = document.getElementById('code').value.trim().toUpperCase();
            const name = document.getElementById('name').value.trim();
            const color = document.getElementById('color').value.trim();

            if (!code || !name) {
                alert('Please fill in all fields');
                return;
            }

            try {
                let response;
                if (id) {
                    // Update existing
                    response = await fetch(`${API_URL}/faction-types/${id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ code, name, color })
                    });
                } else {
                    // Create new
                    response = await fetch(`${API_URL}/faction-types`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ code, name, color })
                    });
                }

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to save faction type');
                }

                // Reload the list
                await loadFactionTypes();

                // Hide and reset form
                cancelForm();

                alert(id ? 'Faction type updated successfully!' : 'Faction type added successfully!');
            } catch (error) {
                console.error('Error saving faction type:', error);
                alert('Failed to save faction type: ' + error.message);
            }
        });

        // Initialize
        loadFactionTypes();
    </script>
</body>
</html>
