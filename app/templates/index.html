<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STFC Rep Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>
    <nav>
        <a href="/" class="active">Tracker</a>
        <a href="/factions.html">Factions</a>
        <a href="/faction-types.html">Faction Types</a>
        <a href="/reputations.html">Reputations</a>
    </nav>

    <h1>STFC Reputation Tracker</h1>


    <div class="container">
        <h2>Add New Entry</h2>
        <form id="entryForm">
            <div class="form-group">
                <label>Select Faction:</label>
                <div id="factionButtons" class="faction-buttons">
                    <!-- Buttons will be loaded here -->
                </div>
                <input type="hidden" id="faction" required>
            </div>
            <div class="form-group">
                <label for="value">Reputation Value:</label>
                <input type="number" id="value" required placeholder="Enter reputation value">
            </div>
            <button type="submit" style="width: 100%;">Add Entry</button>
        </form>
    </div>

    <div class="chart-container">
        <canvas id="repChart"></canvas>
    </div>


    <script>
        // API base URL
        const API_URL = '/api';

        // Data storage
        let factionsData = [];
        let selectedFaction = '';
        let factionColorsMap = {};

        // Load factions with status into buttons
        async function loadFactions() {
            try {
                const response = await fetch(`${API_URL}/factions/summary`);
                if (!response.ok) {
                    throw new Error('Failed to load factions');
                }
                const factionList = await response.json();
                const container = document.getElementById('factionButtons');
                const hiddenInput = document.getElementById('faction');

                container.innerHTML = '';
                
                // Update color map
                factionList.forEach(f => {
                    if (f.color) factionColorsMap[f.name] = f.color;
                });

                factionList.forEach(faction => {
                    const btn = document.createElement('div');
                    btn.className = 'faction-btn';
                    if (selectedFaction === faction.name) {
                        btn.classList.add('selected');
                        if (faction.color) {
                            btn.style.borderColor = faction.color;
                            btn.style.backgroundColor = faction.color + '1a'; // 10% opacity
                        }
                    }
                    
                    const status = faction.status || {};
                    
                    let factionNameStyle = faction.color ? `color: ${faction.color};` : '';
                    if (faction.name === 'Augment') {
                        factionNameStyle += ' -webkit-text-stroke: 0.5px black; text-shadow: 0 0 1px black;';
                    }
                    
                    btn.innerHTML = `
                        <div class="faction-name" style="${factionNameStyle}">${faction.name}</div>
                        <div class="faction-status">
                            <div class="status-item"><span class="status-label">Value:</span><span class="status-value">${faction.current_value.toLocaleString()}</span></div>
                            <div class="status-item"><span class="status-label">Δ:</span><span class="status-value">${faction.last_delta >= 0 ? '+' : ''}${faction.last_delta.toLocaleString()}</span></div>
                            <div class="status-item"><span class="status-label">Rate:</span><span class="status-value">${status.raw_change_per_minute || 0}/min</span></div>
                            <div class="status-item"><span class="status-label">Time:</span><span class="status-value">${status.minutes || 0}m</span></div>
                        </div>
                    `;
                    
                    btn.onclick = () => {
                        document.querySelectorAll('.faction-btn').forEach(b => {
                            b.classList.remove('selected');
                            b.style.borderColor = '';
                            b.style.backgroundColor = '';
                        });
                        btn.classList.add('selected');
                        if (faction.color) {
                            btn.style.borderColor = faction.color;
                            btn.style.backgroundColor = faction.color + '1a';
                        }
                        selectedFaction = faction.name;
                        hiddenInput.value = faction.name;
                    };
                    
                    container.appendChild(btn);
                });
                
                // If there's a selected faction, make sure hidden input is set
                if (selectedFaction) {
                    hiddenInput.value = selectedFaction;
                }
            } catch (error) {
                console.error('Error loading factions:', error);
            }
        }

        // Initialize chart
        const ctx = document.getElementById('repChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: []
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'time',
                        time: {
                            unit: 'minute',
                            displayFormats: {
                                minute: 'MMM d, HH:mm'
                            }
                        },
                        title: {
                            display: true,
                            text: 'Time'
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'Reputation Value'
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'top'
                    },
                    tooltip: {
                        mode: 'index',
                        intersect: false
                    }
                }
            }
        });

        // Load data from backend
        async function loadData() {
            try {
                const response = await fetch(`${API_URL}/entries`);
                if (!response.ok) {
                    throw new Error('Failed to load data');
                }
                const data = await response.json();
                updateChart(data);
            } catch (error) {
                console.error('Error loading data:', error);
                alert('Failed to load data from server. Make sure the backend is running.');
            }
        }

        // Update chart
        function updateChart(data) {
            const datasets = [];

            for (const [factionName, entries] of Object.entries(data)) {
                if (entries.length > 0) {
                    const color = factionColorsMap[factionName] || 'rgb(128, 128, 128)';
                    datasets.push({
                        label: factionName,
                        data: entries.map(entry => ({
                            x: new Date(entry.timestamp),
                            y: entry.value
                        })),
                        borderColor: color,
                        backgroundColor: color.startsWith('rgb') ? color.replace(')', ', 0.2)') : color + '33',
                        tension: 0.1
                    });
                }
            }

            chart.data.datasets = datasets;
            chart.update();
        }

        // Handle form submission
        document.getElementById('entryForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const faction = document.getElementById('faction').value;
            const value = parseInt(document.getElementById('value').value);

            if (!faction || isNaN(value)) {
                alert('Please fill in all fields');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/entries`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        faction: faction,
                        value: value
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to add entry');
                }

                const entry = await response.json();

                // Reload data and update chart
                await loadData();
                // Reload faction buttons to update status
                await loadFactions();

                // Reset form
                document.getElementById('value').value = '';

                alert(`Added entry for ${faction}: ${value} (Δ ${entry.value_delta >= 0 ? '+' : ''}${entry.value_delta})`);
            } catch (error) {
                console.error('Error adding entry:', error);
                alert('Failed to add entry: ' + error.message);
            }
        });

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            loadFactions();
            loadData();
        });
    </script>
</body>
</html>
