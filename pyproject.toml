[project]
name = "stfc-rep-tracker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=44.0.0",
    "easyocr==1.7.2",
    "flasgger==0.9.7.1",
    "Flask==3.1.3",
    "flask-cors==6.0.2",
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.0.0",
    "httplib2>=0.22.0",
    "numpy==2.5.2",
    "opencv-python==5.0.0.93",
    "psycopg2-binary==2.9.13",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "PyAutoGUI==0.9.54",
    "PyGetWindow==0.0.9",
    "python-dotenv==1.2.4",
    "pywin32==312",
    "PyYAML==6.0.3",
    "Werkzeug==3.1.6",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["tmp", ".venv", "build", "dist", "frontend", "node_modules"]
# -rs prints every skip reason, so DB tests skipped for a missing
# DATABASE_URL_TEST are never mistaken for a pass.
addopts = "-rs"
markers = [
    "db: needs a disposable Postgres via DATABASE_URL_TEST (Neon branch)",
]
