stfc_config:
  # Directory where screenshots are saved
  screenshots_dir: Screenshots
  # Max poll attempts waiting for a screen transition (collect, list indicator, etc.)
  screen_wait_retries: 8
  # Seconds between each poll attempt
  screen_wait_delay: 0.25


  # Directory containing template snippet images
  snippets_dir: app/screen_snippets

  # STFC window title substrings to search for (first match wins)
  window_titles:
    - "Star Trek Fleet Command"
    - STFC

  # Minimum template match confidence to consider a button "visible"
  button_match_threshold: 0.85

  navigation:
    # Max capture-and-check cycles before giving up
    max_retries: 8
    # Seconds to pause after clicking a nav button
    wait_after_click: 1.0
    # Seconds to wait when a busy/loading screen is detected
    busy_wait: 1.5

  factions:
    # Number of recent status entries to retrieve and average for rate/projection calculations
    avg_entries: 10
    # Minimum match score for SelectedRow snippets to identify highlighted faction
    snippet_threshold: 0.70
    # Timing for waiting on the confirm snippet after clicking a faction button.
    # The panel animates open, so the first check is delayed longer than the rest.
    # Total max wait = confirm_first_delay + confirm_retries × confirm_delay
    #                = 0.5 + 8 × 0.2 = 2.1s
    confirm_first_delay: 0.5
    confirm_retries: 8
    confirm_delay: 0.2
    # Fraction of snippet height used for template matching on RepButton/SelectedRow snippets.
    # Set < 1.0 to exclude the reputation tier label (e.g. "RESPECTED") from the match,
    # so snippets remain valid after a tier change. The full height is still used for clicks.
    snippet_name_height_frac: 0.60
    # Fallback threshold for clicking a faction button that is already in its selected
    # (brighter) state and scores below the normal button_match_threshold.
    button_selected_threshold: 0.60

  away_teams:
    # Timing for waiting on the COLLECT button after clicking REPORT.
    # The panel animates open, so the first check is delayed longer than the rest.
    # Total max wait = collect_first_delay + collect_retries × collect_delay
    #                = 0.5 + 16 × 0.25 = 4.5s
    collect_first_delay: 0.5
    collect_retries: 16
    collect_delay: 0.25
    # Seconds to wait after clicking COLLECT before checking for the next REPORT.
    # The game shows a reward panel that must dismiss before the list is interactive again.
    post_collect_delay: 2.0

  gifts:
    # Seconds to wait between navigation steps
    loop_delay: 0.25
    # Timing for waiting on the Done button after clicking Claim All.
    # The rewards panel animates open, so the first check is delayed longer.
    # Total max wait = claim_first_delay + claim_done_retries × claim_done_delay
    #                = 0.5 + 16 × 0.25 = 4.5s
    claim_first_delay: 0.5
    claim_done_retries: 16
    claim_done_delay: 0.25
    # Timing for waiting on the gifts list to reload after clicking Done.
    # Total max wait = reload_first_delay + screen_wait_retries × reload_delay
    #                = 0.5 + 8 × 0.2 = 2.1s
    reload_first_delay: 0.5
    reload_delay: 0.2

  google_calendar:
    # OAuth2 client credentials downloaded from Google Cloud Console.
    # Create a project, enable the Google Calendar API, create an OAuth2 Desktop
    # client ID, download the JSON, and save it at this path (relative to project root).
    credentials_file: google_credentials 2.json
    # Token written after the first successful auth flow. Refreshed automatically.
    token_file: google_token.json

  territory:
    # Known territory systems.  Each entry needs a display name and one or more
    # snippet filenames for template matching.  Add a new entry here whenever
    # your alliance captures a new system — no code changes required.
    systems:
      - name: Saldeti
        templates:
          - Territory Saldeti 1.jpg
      - name: Gelida
        templates:
          - Territory Gelida 1.jpg
      - name: Zamaro
        templates:
          - Territory Zamaro 1.jpg
      - name: Brijac
        templates:
          - Territory Brijac 1.jpg

    # How many name-template-heights below the name snippet to search for the
    # timer text.  Scales automatically with display resolution.
    timer_strip_frac: 3.0

    # Fallback pixels to crop from the top of the screenshot before OCR,
    # used only when Alliance Territory Zone Slots 1.jpg is not found on screen.
    title_bar_crop_px: 40
    # Minimum EasyOCR confidence to keep a result (0.0–1.0).
    # Lower this if system names with special characters (e.g. accents) are dropped.
    ocr_min_confidence: 0.2
    # Maximum vertical distance in pixels between a system name and its timer
    # for them to be paired together.
    ocr_pair_max_gap_px: 300
    # Badge/emblem labels sit ~10-13% of image height below their timer.
    # System names sit ~18-19% of image height below the previous timer.
    # This fraction is resolution-independent — works the same on HD and 4K.
    # Safe range is anything between 0.13 and 0.18.
    emblem_skip_frac: 0.15
    # Maximum vertical distance (px) to search below a portrait for its
    # matching Next Takeover label.  Should exceed one full row height.
    max_row_height_px: 300
    # Match threshold for the Next Takeover label template.  Lower than the
    # main button_match_threshold because text templates are harder to match.
    next_takeover_threshold: 0.75
    # When the Next Takeover template is not found, strip height is this
    # fraction of the portrait-to-portrait row spacing.  Timer sits at ~24%
    # of row height; badges start at ~70%.  0.50 is a safe midpoint.
    name_timer_height_frac: 0.65
    # How many times to wait for the load-ready template (Next Takeover / green flag)
    # before giving up and attempting OCR anyway.
    ocr_retries: 4
    ocr_retry_delay: 1.0

  combat:
    # Crop region for OCR-ing the current system's name, as a fraction of the
    # captured window (x/y = top-left offset, w/h = size). Target-type history
    # is tracked per system, so this must find real text for scanning to work.
    # TODO: calibrate against a real screenshot — these are starting guesses
    # assuming the system name is shown near the top-center of the screen.
    system_name_x_frac: 0.35
    system_name_y_frac: 0.0
    system_name_w_frac: 0.3
    system_name_h_frac: 0.08

    # Template snippet filenames for hostile ship icons on the system starmap.
    # TODO: capture real crops from the game and list them here — empty by
    # default so scan_targets() fails loudly instead of matching nothing.
    hostile_ship_templates: []

    # Ships whose name label matches this regex are treated as player-owned
    # and excluded from targeting (never attack another player).
    # Default assumes player ships show an alliance tag like "[TAG] Name".
    player_name_pattern: '\[.*?\]'

    # Name/level label crop, relative to each detected ship icon's bounding box.
    # The label sits above the icon in most STFC system views.
    # TODO: calibrate against a real screenshot — these are starting guesses.
    label_gap_frac: 0.1        # gap between icon top and label bottom, × icon height
    label_height_frac: 0.6     # label crop height, × icon height
    label_width_multiplier: 3.0  # label crop width, × icon width (centered on icon)

    # Regex used to pull a level number out of the OCR'd label text.
    level_pattern: '\bL(?:v|vl|evel)?\.?\s*(\d{1,3})\b'
    # Minimum EasyOCR confidence to keep a name/level token (0.0-1.0).
    ocr_min_confidence: 0.2

    # Template snippet filenames for YOUR active/selected ship's icon on the
    # starmap (the one with the highlighted background in the dock bar).
    # Used once per scan to compute distance/intercept time. If left empty,
    # scanning still works but skips the intercept-time scoring factor.
    # TODO: capture a real crop of your active ship's map icon.
    own_ship_templates: []
    # Your active ship's speed in pixels/second AT YOUR CURRENT ZOOM LEVEL —
    # not a real game unit. Calibrate by sending your ship somewhere, timing
    # two screenshots a known number of seconds apart, and measuring how far
    # its icon moved on screen.
    # TODO: calibrate — 40.0 is a placeholder, not a measured value.
    own_ship_speed_px_per_sec: 40.0

    # Targets drift continuously, so scan_targets() samples two screenshots
    # this many seconds apart to derive each target's velocity vector.
    velocity_sample_interval: 1.5
    # Same idea, but for refresh_targets() — the lightweight re-rank used
    # while polling during active combat. Shorter than velocity_sample_interval
    # so each refresh tick stays fast; velocity estimates are noisier as a
    # result, which is an acceptable tradeoff for a value that gets
    # recomputed every few seconds anyway.
    refresh_velocity_sample_interval: 0.8
    # Maximum pixels a target can have moved between the two velocity-sample
    # frames and still be considered the same ship. Raise this if fast
    # targets are being missed/split into two tracks; lower it if unrelated
    # targets are being matched to each other.
    max_track_distance_px: 250
    # Maximum pixels a target can have drifted from its predicted position
    # before a re-acquire (done just before every click) gives up and falls
    # back to clicking the raw predicted position.
    reacquire_max_distance_px: 200

    # How many surviving (non-player) candidates to click through and inspect
    # for cargo/hull/shield. Keep this low — each one is a real click + wait.
    max_candidates_to_inspect: 6
    # Seconds to wait after clicking a candidate before the info panel is
    # assumed to be fully rendered.
    inspect_click_delay: 0.4
    # Key sent to close the info panel between candidates.
    deselect_key: esc
    deselect_delay: 0.3

    # Info panel crop shown after selecting a target, as a fraction of the
    # captured window size (x/y = top-left offset, w/h = size).
    # TODO: calibrate against a real screenshot of the selected-target panel.
    info_panel_x_frac: 0.65
    info_panel_y_frac: 0.15
    info_panel_w_frac: 0.33
    info_panel_h_frac: 0.6

    # Resource names to look for in the info panel text, each followed by a
    # number (e.g. "Ore 12,400"). Extend this list as new resource types
    # appear in loot previews.
    resource_keywords:
      - Ore
      - Gas
      - Tritanium
      - Latinum
      - Parsteel
      - Crystite
    # Optional per-resource multiplier when scoring loot value. Any resource
    # not listed here defaults to a weight of 1.0.
    resource_value_weights: {}

    # How much each factor contributes to a candidate's score (0.0-1.0, should
    # sum to 1.0). loot = normalized cargo value, ease = normalized "easy kill"
    # score (lower level / hull / shield relative to other candidates),
    # intercept = normalized time-to-intercept (shorter is better). intercept
    # is weighted highest by default since a target you can't reach quickly
    # isn't a practical pick even if it looks good on paper. Candidates the
    # interceptor can never reach at all (moving away faster than
    # own_ship_speed_px_per_sec can close) are excluded entirely, not just
    # scored low.
    score_weights:
      loot: 0.3
      ease: 0.3
      intercept: 0.4

    # Seconds to wait after clicking a target before checking for the Attack button.
    select_delay: 0.5
    # Template filenames for the Attack button shown after selecting a target.
    attack_button_templates:
      - Attack Button 1.jpg
    # Optional second confirmation dialog shown after clicking Attack
    # (e.g. "Attack this fleet?"). Leave empty if your game doesn't show one.
    attack_confirm_templates: []
    confirm_wait_retries: 4
    confirm_wait_delay: 0.3

  ocr:
    # Upscale factor applied to the region before OCR runs
    scale_factor: 3
    # Fraction of the window height / width to crop for the Points region
    points_height_frac: 0.20
    points_width_frac: 0.22

  performance:
    # Cache template images in memory after first load.
    # Avoids re-reading the same snippet file from disk on every match call.
    # Disable only if snippet files change while the app is running.
    template_cache: true

    # Screenshot pipeline: "disk" saves each capture as a PNG then reloads it
    # (classic behaviour — good for step-by-step debugging); "memory" keeps
    # frames as numpy arrays and skips all disk I/O during polling loops (faster).
    capture_mode: memory   # "disk" | "memory"

    # When capture_mode is "memory", also write each captured frame to
    # screenshots_dir on a background thread for post-mortem review.
    # Has no effect when capture_mode is "disk" (files are always written there).
    write_behind: false

    # Maximum frames queued for write-behind before new frames are dropped silently.
    write_behind_queue_size: 20
