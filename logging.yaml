version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s (%(filename)s:%(lineno)d): %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    stream: ext://sys.stdout

loggers:
  # Application modules — set to DEBUG to see verbose OCR/capture output.
  # app.screen_processing covers every capture module (child loggers inherit
  # its level); the per-module entries below override it individually.
  app.screen_processing:
    level: INFO
    handlers: [ console ]
    propagate: false

  # Per-faction template scores and OCR reads during reputation capture.
  app.screen_processing.process_reputations:
    level: INFO
    handlers: [ console ]
    propagate: false

  # Window activation, template matching, and screenshot capture.
  app.screen_processing.screen_capture:
    level: INFO
    handlers: [ console ]
    propagate: false

  app.views.capture_screen_view:
    level: INFO
    handlers: [ console ]
    propagate: false

  app.views.reputations_view:
    level: INFO
    handlers: [ console ]
    propagate: false

  app.database.reputations_dao:
    level: INFO
    handlers: [ console ]
    propagate: false

  # Third-party — keep quiet
  easyocr:
    level: WARNING
    handlers: [ console ]
    propagate: false

  werkzeug:
    level: WARNING
    handlers: [ console ]
    propagate: false

root:
  level: INFO
  handlers: [ console ]