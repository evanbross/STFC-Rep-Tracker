services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stfc
      POSTGRES_PASSWORD: stfc_password
      POSTGRES_DB: stfc_rep_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stfc -d stfc_rep_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "7300:7300"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Internal Docker network address — no SSL needed between containers.
      DATABASE_URL_POOLED: postgresql://stfc:stfc_password@db/stfc_rep_tracker
      DATABASE_URL_DIRECT:  postgresql://stfc:stfc_password@db/stfc_rep_tracker
      FLASK_ENV: production
      SECRET_KEY: change-me-in-production   # ← override via .env or secrets
      DISABLE_CAPTURE: "true"
    volumes:
      # Bind-mount the snippets directory so the host-side capture module and
      # the containerised API share the same template image files.
      - ./app/screen_snippets:/app/app/screen_snippets
      # Settings file — capture module on the host reads this too.
      - ./settings.yaml:/app/settings.yaml:ro
      # Persist generated TLS certs across container restarts.
      - certs:/app/certs

volumes:
  postgres_data:
  certs:
